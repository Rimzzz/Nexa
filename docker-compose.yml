version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexa_db
      POSTGRES_USER: nexa_user
      POSTGRES_PASSWORD: nexa_pass_123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexa_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexa_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_USERNAME: nexa_user
      DB_PASSWORD: nexa_pass_123
      DB_NAME: nexa_db
      JWT_SECRET: nexa_jwt_secret_key_2024
      PORT: 3000
    ports:
      - "3000:3000"
    networks:
      - nexa_network
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexa_frontend
    restart: unless-stopped
    networks:
      - nexa_network
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: nexa_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    networks:
      - nexa_network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local

networks:
  nexa_network:
    driver: bridge
